plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    testImplementation(
            "com.codeborne:selenide:7.18.2",
            "org.junit.jupiter:junit-jupiter:6.1.3")
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// Only these -D properties are forwarded from the Gradle launcher to the test JVM.
def forwardedTestProperties = ['baseUrl', 'browser', 'browserSize', 'headless']

test {
    useJUnitPlatform()

    forwardedTestProperties.each { name ->
        def value = providers.systemProperty(name)
        if (value.present) {
            systemProperty name, value.get()
        }
    }
}
